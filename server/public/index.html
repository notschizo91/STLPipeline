<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Converter - Image to SVG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main App -->
    <div id="app" class="single-screen-layout">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo">
                <img src="https://3dsidehustle.com/wp-content/uploads/2025/09/white-logo-no-bg-Photoroom-1-e1757443093174.png" alt="3D Side Hustle" class="logo-image">
                <span class="logo-subtitle">Vector Converter</span>
            </div>
            <div class="top-actions">
                <a id="downloadBtn" class="download-btn glow-hidden" download style="display: none;">
                    <span class="download-icon">📥</span>
                    <span>Download SVG</span>
                </a>
            </div>
        </div>

        <!-- Center Upload Area -->
        <div class="center-content">
            <div id="dropZone" class="drop-zone-center">
                <svg class="upload-icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                </svg>
                <h2 class="drop-title">Drop Image Here</h2>
                <p class="drop-subtitle">or click to browse</p>
                <input type="file" id="fileInput" accept="image/*" hidden>
            </div>

            <div id="preview" class="preview-center" style="display: none;">
                <div class="preview-grid">
                    <div class="preview-panel">
                        <h3 class="preview-label">Original</h3>
                        <div class="preview-image-container">
                            <img id="previewImage" alt="Preview">
                        </div>
                    </div>
                    <div class="preview-panel">
                        <h3 class="preview-label">Live Preview</h3>
                        <div id="livePreview" class="live-preview-container">
                            <div class="preview-placeholder">
                                <span>Adjust sliders to preview</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="preview-actions">
                    <button id="removeImage" class="btn-remove">✕ Remove</button>
                    <button id="convertBtn" class="btn-convert">Finalize & Download</button>
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-controls">
            <!-- Color Mode Toggle -->
            <div class="mode-toggle-container">
                <span class="mode-label mode-label-active">Black & White</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="colorModeToggle">
                    <span class="toggle-slider"></span>
                </label>
                <span class="mode-label">Color</span>
            </div>

            <div class="slider-group">
                <div class="slider-item">
                    <label>
                        <span class="slider-label">Detail</span>
                        <span class="slider-value" id="detailValue">Medium</span>
                    </label>
                    <input type="range" id="detail" min="1" max="3" value="2" step="1">
                    <div class="slider-marks">
                        <span>Low</span>
                        <span>Med</span>
                        <span>High</span>
                    </div>
                </div>

                <div class="slider-item">
                    <label>
                        <span class="slider-label">Smoothness</span>
                        <span class="slider-value" id="smoothnessValue">Medium</span>
                    </label>
                    <input type="range" id="smoothness" min="1" max="3" value="2" step="1">
                    <div class="slider-marks">
                        <span>Sharp</span>
                        <span>Med</span>
                        <span>Smooth</span>
                    </div>
                </div>

                <div class="slider-item">
                    <label>
                        <span class="slider-label">Contrast</span>
                        <span class="slider-value" id="contrastValue">Balanced</span>
                    </label>
                    <input type="range" id="contrast" min="1" max="5" value="3" step="1">
                    <div class="slider-marks">
                        <span>Dark</span>
                        <span></span>
                        <span>Balanced</span>
                        <span></span>
                        <span>Light</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading" class="loading-overlay" style="display: none;">
            <div class="loading-content">
                <div class="spinner-container">
                    <div class="spinner-large"></div>
                    <div class="spinner-pulse"></div>
                </div>
                <h2 class="loading-title">Converting your image...</h2>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <p id="loadingStep" class="loading-step">
                    <span class="step-icon">🔄</span>
                    <span id="stepText">Initializing...</span>
                </p>
            </div>
        </div>

        <!-- Success Overlay -->
        <div id="successOverlay" class="success-overlay" style="display: none;">
            <div class="success-content">
                <div class="success-checkmark">
                    <svg class="checkmark" viewBox="0 0 52 52">
                        <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                        <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                    </svg>
                </div>
                <h2 class="success-title">Vector Ready!</h2>
                <p class="success-message">Click the download button in the top right</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
